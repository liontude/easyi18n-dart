name: easyi18n_cli
description: >-
  Command-line tool for easyi18n. Pulls translated localization files (Mode A —
  native .arb) and pushes your tr() source strings for translation.
version: 0.2.0
repository: https://github.com/liontude/easyi18n-dart

environment:
  sdk: ^3.9.0

executables:
  easyi18n:

dependencies:
  analyzer: ^13.3.0
  args: ^2.6.0
  http: ^1.2.2
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
